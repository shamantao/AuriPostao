# AuriPostao - Default Configuration
# Template version: 1.0.0
#
# Layer priority (highest wins):
#   default (this file) → user (~/.config/auripostao/user.toml)
#   → config/config.toml (local machine, git-ignored)
#   → runtime (env vars APP__ prefix)
#
# For local overrides (paths, secrets): copy values into config/config.toml (git-ignored).

# ---------------------------------------------------------------------------
[app]
name       = "AuriPostao"
mode       = "debug"   # debug | normal
language   = "fr"

# ---------------------------------------------------------------------------
[config]
schema_version       = 1
enable_layered_merge = true
# strict_mode = true will make startup fail on any unknown config key.
strict_mode          = false

# ---------------------------------------------------------------------------
[path_manager]
# Restrict ALL write operations to these root directories.
# In debug mode, an empty list disables the sandbox.
# In normal mode, this list must not be empty.
allowed_roots = []

# Runtime directories — created automatically on first run.
# Override in config/config.toml with absolute paths if needed.
temp_dir    = ".tmp"
logs_dir    = "logs"
reports_dir = "reports"

collision_strategy = "increment"   # increment | suffix | short_hash
normalize_unicode  = false
trim_whitespace    = true

# ---------------------------------------------------------------------------
[logger]
level          = "info"   # trace | debug | info | warn | error
console_pretty = true
file_json      = true

rotation_enabled = true
max_file_mb      = 20
max_files        = 5

include_context_ids = true

# ---------------------------------------------------------------------------
[reporting]
enabled        = true
json_report    = true
csv_report     = true
include_failed = true
